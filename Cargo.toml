[package]
name = "momo-bot"
version = "0.1.0"
edition = "2021"
authors = ["Momo Cat Bot Contributors"]
description = "A Telegram chatbot that speaks in cat language style"

[dependencies]
teloxide = { version = "0.12", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
pretty_env_logger = "0.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
